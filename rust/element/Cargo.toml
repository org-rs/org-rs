[package]
name = "org_element"
version = "0.1.0"
authors = ["Ihor Antonov <ngortheone@gmail.com>"]
edition = "2018"
license = "GPL-3.0-or-later"


[features]
# Parse-tree query helpers (`org_element::testutils`). Enabled automatically
# for the integration test suite via the self dev-dependency below; not
# compiled in normal library builds.
testutils = []
# Parallel parsing via Rayon (splits at level-1 headline boundaries).
par-parse = ["rayon"]


[dependencies]
bumpalo = { version = "3", features = ["collections"] }
rayon = { version = "1.5", optional = true }
memchr = "2.0"
regex = "1"
lazy_static = "^1.3.0"
strum = "0.28"
strum_macros = "0.28"

[dev-dependencies]
criterion = "0.5"
lexpr = "0.2"
goof = "0.3"
# Enable the `testutils` feature when building tests/benches/examples.
org_element = { path = ".", features = ["testutils"] }

[[example]]
name = "corpus-check"
required-features = ["par-parse"]

[[bench]]
name = "parse"
path = "benches/parse.rs"
harness = false

[[bench]]
name = "pattern"
path = "benches/pattern.rs"
harness = false
